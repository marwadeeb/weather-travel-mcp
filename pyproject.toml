[project]
name = "weather-travel-mcp"
version = "0.1.0"
description = "MCP toolkit (FastMCP) with a data, an action and an orchestration tool for weather-based trip planning, driven by an OpenAI Agents SDK agent"
authors = [
    { name = "marwadeeb", email = "marwadeeb.md4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "openai-agents>=0.24.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
weather-travel-mcp = "weather_travel_mcp.server:main"
weather-travel-agent = "weather_travel_mcp.agent:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
